name: 自动部署 Hexo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]  # 推荐升级到 LTS 版本（18.x/20.x）

    steps:
      - name: 检出代码
        uses: actions/checkout@v4  # 升级到 v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 显式传递 token

      - name: 设置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4  # 升级到 v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'  # 自动缓存 node_modules

      - name: 安装 Hexo CLI
        run: |
          npm install hexo-cli -g
        env:
          TZ: Asia/Shanghai  # 更规范的时区设置方式

      - name: 缓存依赖
        uses: actions/cache@v4
        id: cache-dependencies
        with:
          path: |
            node_modules
            ~/.npm  # 增加 npm 缓存目录
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: 安装插件
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci  # 使用 ci 代替 install 保证依赖一致性

      - name: 生成并部署博客
        run: |
          hexo clean && hexo g && hexo douban
          
          cd ./public
          
          # 初始化 Git 并配置
          git init
          git config --global user.name "${{ secrets.GIT_NAME }}"
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          
          # 添加文件并提交
          git add .
          git commit -m "GitHub Actions Auto Build: ${{ github.sha }}"
          
          # 强制推送到目标仓库
          git push --force --quiet "https://${{ secrets.GITHUB_TOKEN }}@github.com/ddmaster2608/ddmaster2608.github.io.git" master:main
