name: 自动部署 Hexo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]  # 使用 Node.js 20 LTS

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 安装 Hexo CLI
        run: npm install hexo-cli -g
        env:
          TZ: Asia/Shanghai

      - name: 缓存依赖
        uses: actions/cache@v4
        id: cache-dependencies
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: 安装插件
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: 生成静态文件
        run: |
          hexo clean
          hexo g
          hexo douban  # 确保此插件已正确安装
          ls -al public  # 调试：检查 public 是否存在

      - name: 部署到 GitHub Pages
        run: |
          cd ./public
          
          # 初始化 Git（局部配置）
          git init
          git config user.name "${{ secrets.GIT_NAME }}"
          git config user.email "${{ secrets.GIT_EMAIL }}"
          
          # 添加文件并提交
          git add .
          git commit -m "Auto deploy: ${{ github.sha }}"
          
          # 使用 PAT 推送（非 GITHUB_TOKEN）
          git push --force --quiet "https://${{ secrets.PAT_TOKEN }}@github.com/ddmaster2608/ddmaster2608.github.io.git" HEAD:main
