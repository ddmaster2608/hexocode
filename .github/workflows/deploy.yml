name: Deploy Hexo

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      DEPLOY_TOKEN: ${{ secrets.PAT_TOKEN }}
      GIT_NAME: ${{ secrets.GIT_NAME }}
      GIT_EMAIL: ${{ secrets.GIT_EMAIL }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Publish generated site
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "PAT_TOKEN secret is missing."
            exit 1
          fi

          cd public
          git init
          git config user.name "${GIT_NAME:-github-actions[bot]}"
          git config user.email "${GIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add .
          git commit -m "Auto deploy: ${GITHUB_SHA}" || echo "No content changes to commit."
          git push --force "https://x-access-token:${DEPLOY_TOKEN}@github.com/ddmaster2608/ddmaster2608.github.io.git" HEAD:main
