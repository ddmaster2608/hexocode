info:
  title: "Goodnut's BLOG"
  subtitle: Learning, tinkering, and notes.
  author: GoodNut
  url: https://ddmaster2608.github.io

defaults:
  favicon: /images/favicon.ico
  logo: /images/logo.jpg
  avatar: /images/avatar.jpg

global:
  website_counter:
    enable: false
    site_pv: false
    site_uv: false
    post_pv: false
  preloader:
    enable: false
  open_graph:
    enable: true
    image: /images/avatar.jpg
    description: Learning, tinkering, and notes.

home_banner:
  enable: true
  image:
    light: /images/banner-light.jpg
    dark: /images/banner-dark.png
  title: "Goodnut's BLOG"
  subtitle:
    text:
      - Pao de kuai bu yi ding neng shu
      - Lao die gen tou, cai shi cheng gong

navbar:
  links:
    Home:
      path: /
      icon: fa-regular fa-house
    Archives:
      path: /archives
      icon: fa-regular fa-box-archive
    Categories:
      path: /categories
      icon: fa-regular fa-folder-open
    Tags:
      path: /tags
      icon: fa-regular fa-tags
  search:
    enable: false

home:
  sidebar:
    enable: true
    position: left
    first_item: info
    announcement: Shen wu cai feng shuang fei yi, xin you ling xi yi dian tong.
    show_on_mobile: true
    links:
      Archives:
        path: /archives
        icon: fa-regular fa-box-archive
      Categories:
        path: /categories
        icon: fa-regular fa-folder-open
      Tags:
        path: /tags
        icon: fa-regular fa-tags

articles:
  word_count:
    enable: true
    count: true
    min2read: true
  copyright:
    enable: true
    default: cc_by_nc_sa

comment:
  enable: false

footer:
  runtime: false
  statistics: false
  customize: Goodnut's BLOG
  icp:
    enable: false

plugins:
  feed:
    enable: false
  aplayer:
    enable: false
  mermaid:
    enable: false
